<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পুজোর গান</title>
    <meta name="description" content="A curated music playlist and live radio room for the Indian Mistri. Relax, enjoy, and build with pride while listening to classic hits.">
    <meta name="keywords" content="Indian Mistri, Mistri Playlist, Hindi Songs, Builders Playlist, Construction Music, Indian Construction, Geetmala, Live Radio">
    <meta property="og:title" content="इंপুজোর গান">
    <meta property="og:description" content="A curated music playlist for the Indian Mistri. Relax, enjoy, and build with pride.">
    <meta property="og:type" content="website">
    <meta name="robots" content="index, follow">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero-bg"></div>
    <div class="dark-overlay"></div>
    
    <div class="app-container">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="clock pill glass" id="clock">--:-- --</div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="https://www.instagram.com/debraj.mp4/" target="_blank" class="share-link" title="Instagram" style="color: var(--color-chai-cream);">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2zm0 2A3.8 3.8 0 0 0 4 7.8v8.4A3.8 3.8 0 0 0 7.8 20h8.4a3.8 3.8 0 0 0 3.8-3.8V7.8A3.8 3.8 0 0 0 16.2 4H7.8zm8.7 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
                    </svg>
                </a>
                <a href="https://music.youtube.com/playlist?list=PLE5lMB1jmOCo&si=ODcbj1gvXZ2AXsI6" target="_blank" class="share-link" title="Open YouTube Music Playlist">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="#FF0000">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                    </svg>
                </a>
                <div class="listener-badge pill glass">
                    <span class="pulse-dot"></span>
                    <span id="listener-count">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Hero Center -->
        <main class="hero-center">
            <h1 class="headline" style="color: var(--color-white);">পুজোর গান</h1>
        </main>

        <!-- Music Player Bar -->
        <div class="player-wrapper">
            <div class="player-card glass horizontal-player">
                <div class="track-thumbnail-section">
                    <div class="thumbnail-wrapper">
                        <img id="track-thumbnail" class="track-thumbnail" src="" alt="Cover Art" style="display: none;">
                        <div class="buffering-icon" id="buffering-icon">
                            <svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle></svg>
                        </div>
                    </div>
                </div>
                
                <div class="player-middle">
                    <div class="track-details">
                        <div class="track-title-wrapper">
                            <div class="track-title" id="track-title">Loading...</div>
                        </div>
                        <div class="track-artist" id="track-artist">Please wait</div>
                    </div>
                    
                    <div class="progress-wrapper">
                        <div class="progress-container" id="progress-container">
                            <div class="progress-bar" id="progress-bar"></div>
                        </div>
                        <div class="time-display">
                            <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
                        </div>
                    </div>
                </div>
                
                <div class="player-right-controls">
                    <button class="control-btn circle-btn" id="prev-btn">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                    </button>
                    <button class="control-btn play-btn" id="play-pause-btn">
                        <svg id="play-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg id="pause-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="currentColor" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </button>
                    <button class="control-btn circle-btn" id="next-btn">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                    </button>
                    
                    <div class="volume-control-wrapper">
                        <button id="mute-btn" class="control-btn circle-btn" style="padding: 0.25rem;">
                            <svg id="vol-icon" class="volume-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                            <svg id="mute-icon" class="volume-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" style="display: none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                        </button>
                        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100">
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Disclaimer Footer -->
        <footer class="footer" style="text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 2rem; padding: 1rem;">
            <p>Disclaimer: We do not own the music or thumbnails used on this site. All content is streamed from YouTube and belongs to its respective copyright owners.</p>
        </footer>
    </div>

    <!-- VH1 Style Playing Next Banner -->
    <div id="vh1-banner" class="vh1-banner">
        <div class="vh1-header">UP NEXT</div>
        <div class="vh1-content">
            <img id="vh1-thumbnail" class="vh1-thumbnail" src="" alt="Next Track">
            <div id="vh1-title" class="vh1-title">Loading...</div>
        </div>
    </div>

    <!-- Hidden YouTube Player -->
    <div id="yt-player-container" style="position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; overflow: hidden;">
        <div id="youtube-player"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
